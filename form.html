    <body class="background">
        <section class="">
            <div class="container-fluid">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-8 col-md-3 col-lg-4 col-sm-8">
                        <img src="assets/logo.png" id="logo" class="w-100"/>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>
        </section>
        <section class="body-content">
            <div class="container-fluid backdrop col-10 col-lg-6 col-md-6 col-sm-10">
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-10 col-md-8 col-sm-10">
                        <h2>Stand a chance to win R250k in trips and retro kits</h2>
                        <h4>Fill in your details to enter</h4>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
                <div class="row">
                    <div class="col col-lg col-md col-sm">
</div>
                    <div class="col-10 col-lg-10 col-md-8 col-sm-10">
                        <form role="form">
                            <div class="mb-1">
                                <label for="firstAndLastName">First and last name*</label>
                                <input type="text" class="form-control" id="firstAndLastName" name="firstAndLastName" aria-describedby="firstAndLastName" placeholder="first and last name" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="cellNumber">Cell number*</label>
                                <input type="tel" class="form-control" id="cellNumber" name="cellNumber" placeholder="e.g 0841234567" required="true"/>
                            </div>
                            <div class="mb-1">
                                <label for="EmailAddress">Email address*</label>
                                <input type="email" class="form-control" id="EmailAddress" name="EmailAddress" placeholder="example@domain.com"/>
                            </div>
                            <div class="mb-1">
                                <label for="province">Province*</label>
                                <select id="province" name="province" class="form-control" required="true">
                                    <option value="">select</option>
                                    <option value="Option1">Option1</option>
                                    <option value="Option2">Option2</option>
                                    <option value="Option3">Option3</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label for="fileUpload">Upload your till slip*</label><br>
                                <input type="file" class="" id="fileUpload"/>
                            </div>
                            <div class="form-check mb-1 pt-2">
                                <input type="checkbox" class="form-check-input" id="optIn"/>
                                <label class="form-check-label pb-0 ps-2 pt-2" for="optIn">Opt in for communications</label>
                            </div>
                            <div class="form-check mb-1">
                                <input type="checkbox" class="form-check-input" id="termsAndConditions"/>
                                <label class="form-check-label pb-0 ps-2 pt-0" for="termsAndConditions">I accept the <a href="#"> Terms and Conditions*</a>
                                </label>
                            </div>
                            <button type="submit" class="btn btn-primary mb-3">Submit</button>
                        </form>
                    </div>
                    <div class="col col-lg col-md col-sm">
</div>
                </div>
            </div>
        </section>
        <section class="mt-5">
            <div class="ara-desktop">
                <img src="assets/desktop-ara-line.png" alt="ara-line" class="" style="width:100%;"/>
            </div>
            <div class="ara-mobile">
                <img src="assets/mobile-ara-line.png" alt="ara-line" class="" style="width:100%;"/>
            </div>
        </section>
